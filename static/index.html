<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chottu — Shop Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f5f0;
  --surface:#ffffff;
  --surface2:#f8f8f5;
  --border:#e8e8e2;
  --border2:#d8d8d0;
  --green:#1a9e72;
  --green-dark:#0d7a58;
  --green-light:#e8f7f2;
  --green-mid:#c2ecdf;
  --text:#1a1a18;
  --text2:#555550;
  --text3:#999990;
  --red-bg:#fdf0ef;--red:#c0392b;
  --yellow-bg:#fef9ec;--yellow:#b45309;
  --blue-bg:#eff6ff;--blue:#1d4ed8;
  --purple-bg:#f5f0ff;--purple:#6d28d9;
  --orange-bg:#fff7ed;--orange:#c2410c;
  --r:20px;--r-sm:12px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px;}

/* ── SHELL ── */
.shell{
  width:100%;max-width:760px;
  background:var(--surface);
  border-radius:var(--r);
  border:1px solid var(--border);
  box-shadow:0 4px 24px rgba(0,0,0,0.07),0 1px 4px rgba(0,0,0,0.04);
  display:flex;flex-direction:column;
  height:88vh;max-height:700px;
  overflow:hidden;
}

/* ── HEADER ── */
.hdr{
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;background:var(--surface);
}
.hdr-l{display:flex;align-items:center;gap:11px;}
.av-wrap{position:relative;flex-shrink:0;}
.av{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;
}
.av-dot{
  position:absolute;bottom:1px;right:1px;
  width:9px;height:9px;border-radius:50%;
  background:#22c55e;border:2px solid var(--surface);
}
.hdr-name{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.2px;}
.hdr-sub{font-size:11.5px;color:var(--text3);margin-top:1px;}
.hdr-badge{
  display:flex;align-items:center;gap:5px;
  background:var(--green-light);border:1px solid var(--green-mid);
  border-radius:20px;padding:3px 10px;
  font-size:11px;font-weight:500;color:var(--green-dark);
}
.hdr-badge .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

/* ── CHIPS ── */
.chips{
  padding:9px 16px;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--border);flex-shrink:0;
  background:var(--surface2);
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;
  background:var(--surface);border:1px solid var(--border2);
  color:var(--text2);font-size:11.5px;font-family:inherit;
  padding:4px 12px;border-radius:20px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip:hover{background:var(--green-light);border-color:var(--green-mid);color:var(--green-dark);}

/* ── MESSAGES ── */
.msgs{
  flex:1;overflow-y:auto;
  padding:18px 18px 10px;
  display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;
}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* welcome */
.welcome{
  text-align:center;padding:20px 12px 12px;
  animation:fadeUp .35s ease;
}
.welcome-icon{font-size:34px;margin-bottom:8px;}
.welcome-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px;}
.welcome-sub{font-size:13px;color:var(--text2);line-height:1.6;}
.wc-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.wc-chip{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);font-size:12px;font-family:inherit;
  padding:5px 13px;border-radius:20px;cursor:pointer;
  transition:all .15s;
}
.wc-chip:hover{background:var(--green-light);border-color:var(--green-mid);color:var(--green-dark);}

/* message rows */
.row{display:flex;gap:9px;align-items:flex-end;animation:fadeUp .25s ease;}
.row.user{flex-direction:row-reverse;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg-av{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:600;flex-shrink:0;
}
.msg-av.bot{background:var(--green-light);color:var(--green-dark);}
.msg-av.user{background:#f0f0ea;color:var(--text3);}
.col{display:flex;flex-direction:column;gap:5px;max-width:74%;}
.row.user .col{align-items:flex-end;}

/* bubbles */
.bub{
  padding:10px 14px;
  font-size:13.5px;line-height:1.65;
}
.bub.bot{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:4px 16px 16px 16px;
  color:var(--text);
}
.bub.user{
  background:var(--green);color:#fff;
  border-radius:16px 4px 16px 16px;
}

/* meta row */
.meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.row.user .meta{justify-content:flex-end;}

/* pills */
.pill{
  font-size:10.5px;padding:2px 8px;
  border-radius:20px;font-weight:500;
  display:inline-flex;align-items:center;gap:3px;
}
.pill-neg{background:var(--red-bg);color:var(--red);}
.pill-pos{background:var(--green-light);color:var(--green-dark);}
.pill-neu{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.pill-urg{background:var(--orange-bg);color:var(--orange);}
.pill-sar{background:var(--purple-bg);color:var(--purple);}
.pill-grt{background:var(--blue-bg);color:var(--blue);}
.pill-src{background:var(--surface2);color:var(--text3);border:1px solid var(--border);font-size:10px;}
.pill-ml{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;}
.pill-en{background:var(--blue-bg);color:#1e40af;border:1px solid #bfdbfe;}
.pill-ai{background:var(--purple-bg);color:#5b21b6;border:1px solid #ddd6fe;}
.pill-faq{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
.pill-ms{font-size:10px;color:var(--text3);}
.pill-sem{background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-size:10px;}

/* escalation */
.esc-bar{
  display:flex;align-items:flex-start;gap:6px;
  background:var(--orange-bg);border:1px solid #fed7aa;
  border-radius:8px;padding:7px 10px;
  font-size:11.5px;color:var(--orange);line-height:1.4;
  margin-top:2px;
}

/* typing */
.typing-row{display:flex;gap:9px;align-items:center;animation:fadeUp .25s ease;}
.typing-bub{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:4px 16px 16px 16px;
  padding:10px 14px;display:flex;gap:4px;align-items:center;
}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:tdot 1.2s infinite ease-in-out;}
.tdot:nth-child(1){animation-delay:0s;}
.tdot:nth-child(2){animation-delay:.18s;}
.tdot:nth-child(3){animation-delay:.36s;}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}

/* ── INPUT ── */
.inp-area{
  padding:10px 16px 14px;
  border-top:1px solid var(--border);
  flex-shrink:0;background:var(--surface);
}
.inp-wrap{
  display:flex;gap:8px;align-items:flex-end;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:22px;
  padding:7px 8px 7px 14px;
  transition:border-color .2s,box-shadow .2s;
}
.inp-wrap:focus-within{
  border-color:var(--green);
  box-shadow:0 0 0 3px var(--green-light);
}
#ci{
  flex:1;background:transparent;border:none;outline:none;
  font-family:inherit;font-size:13.5px;color:var(--text);
  resize:none;max-height:90px;min-height:20px;
  line-height:1.55;padding:2px 0;overflow-y:auto;
}
#ci::placeholder{color:var(--text3);}
#sb{
  width:34px;height:34px;border-radius:50%;
  border:none;background:var(--green);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s,transform .1s,opacity .15s;
}
#sb:hover{background:var(--green-dark);}
#sb:active{transform:scale(.92);}
#sb svg{width:14px;height:14px;fill:#fff;}
.inp-hint{font-size:11px;color:var(--text3);text-align:center;margin-top:6px;}
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-l">
      <div class="av-wrap">
        <div class="av">🛍️</div>
        <div class="av-dot"></div>
      </div>
      <div>
        <div class="hdr-name">Chottu — Shop Assistant</div>
        <div class="hdr-sub">Kerala Clothing Store · English &amp; Manglish</div>
      </div>
    </div>
    <div class="hdr-badge"><span class="dot"></span>Online</div>
  </div>

  <!-- QUICK CHIPS -->
  <div class="chips">
    <button class="chip" onclick="qs('Price enthu aanu?')">💰 Price</button>
    <button class="chip" onclick="qs('Delivery undu?')">🚚 Delivery</button>
    <button class="chip" onclick="qs('Return cheyyano?')">↩️ Return</button>
    <button class="chip" onclick="qs('Offer undu?')">🏷️ Offers</button>
    <button class="chip" onclick="qs('Payment options enthu?')">💳 Payment</button>
    <button class="chip" onclick="qs('Order track cheyyan engane?')">📦 Tracking</button>
    <button class="chip" onclick="qs('Refund kittуmo?')">💸 Refund</button>
    <button class="chip" onclick="qs('Contact number enthu?')">📞 Contact</button>
    <button class="chip" onclick="qs('Shop evide aanu?')">📍 Location</button>
    <button class="chip" onclick="qs('Appointment edukano?')">📅 Appointment</button>
  </div>

  <!-- MESSAGES -->
  <div class="msgs" id="msgs">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">👋</div>
      <div class="welcome-title">Namaskaram! I'm Chottu</div>
      <div class="welcome-sub">Your friendly shop assistant — ask anything in <strong>English</strong> or <strong>Manglish</strong>. Njan help cheyyam!</div>
      <div class="wc-chips">
        <button class="wc-chip" onclick="qs('Refund tharilla! Fraud aanu ithu')">😤 Refund issue</button>
        <button class="wc-chip" onclick="qs('Adipoli service! Kollam aayirunnu')">😊 Great service</button>
        <button class="wc-chip" onclick="qs('Urgent! Order cancel cheyyam ippo')">⚡ Cancel order</button>
        <button class="wc-chip" onclick="qs('Njan engane product order cheyyam?')">🛒 How to order</button>
        <button class="wc-chip" onclick="qs('Damaged product kitti, enthu cheyyam?')">📦 Damaged item</button>
        <button class="wc-chip" onclick="qs('What is the return policy?')">📋 Return policy</button>
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="inp-area">
    <div class="inp-wrap">
      <textarea id="ci" rows="1" placeholder="Type in English or Manglish…"></textarea>
      <button id="sb" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="inp-hint">Enter to send · Shift+Enter for new line</div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════
//  CONFIG — point to your FastAPI backend
// ════════════════════════════════════════════════════

// If running HTML and FastAPI on same machine: keep as-is.
// If deployed separately: change to your server URL e.g. "https://yourserver.com"
const API_BASE = '';   // empty = same origin
const CHAT_URL = `${API_BASE}/chat`;

// ════════════════════════════════════════════════════
//  CALL FASTAPI  /chat
// ════════════════════════════════════════════════════

async function callBackend(message) {
  const resp = await fetch(CHAT_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ message }),
  });

  if (!resp.ok) {
    const err = await resp.text().catch(() => 'Unknown error');
    throw new Error(`Server error ${resp.status}: ${err}`);
  }

  return await resp.json();
  // Returns: { message, sentiment, confidence, reply, source,
  //            faq_source, faq_id, faq_score, escalate, ms }
}

// ════════════════════════════════════════════════════
//  UI HELPERS
// ════════════════════════════════════════════════════

const msgsEl = document.getElementById('msgs');
const ciEl   = document.getElementById('ci');
let busy = false;

function scrollBot() { msgsEl.scrollTop = msgsEl.scrollHeight; }

function esc(t) {
  return String(t)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}

// Map sentiment → pill CSS class
function sentCls(s) {
  return { negative:'neg', positive:'pos', neutral:'neu',
           sarcastic:'sar', urgent:'urg', greeting:'grt' }[s] || 'neu';
}

// Map sentiment → emoji
function sentEmoji(s) {
  return { negative:'😞', positive:'😊', neutral:'💬',
           sarcastic:'😏', urgent:'⚡', greeting:'👋' }[s] || '💬';
}

// Map faq_source → pill CSS class
function srcCls(src) {
  if (!src) return 'pill-ai';
  if (src === 'ollama')          return 'pill-ai';
  if (src === 'greeting')        return 'pill-grt';
  if (src === 'manglish')        return 'pill-ml';
  if (src === 'english')         return 'pill-en';
  if (src === 'sentiment_aware') return 'pill-faq';
  if (src.startsWith('shop_'))   return 'pill-faq';
  return 'pill-src';
}

// Human-readable source label
function srcLabel(source, faqSource) {
  if (source === 'greeting') return 'Greeting';
  if (source === 'ollama')   return 'AI · Ollama';
  if (!faqSource)            return 'AI · Ollama';
  if (faqSource === 'sentiment_aware') return 'FAQ · Sentiment';
  if (faqSource === 'manglish')        return 'ML · FAQ';
  if (faqSource === 'english')         return 'EN · FAQ';
  if (faqSource.startsWith('shop_'))   return 'Shop · FAQ';
  return faqSource;
}

// ════════════════════════════════════════════════════
//  RENDER FUNCTIONS
// ════════════════════════════════════════════════════

function addUser(text) {
  document.getElementById('welcome')?.remove();
  const d = document.createElement('div');
  d.className = 'row user';
  d.innerHTML = `<div class="msg-av user">YOU</div>
    <div class="col"><div class="bub user">${esc(text)}</div></div>`;
  msgsEl.appendChild(d);
  scrollBot();
}

function addTyping() {
  const d = document.createElement('div');
  d.className = 'typing-row'; d.id = 'tr';
  d.innerHTML = `<div class="msg-av bot">Ch</div>
    <div class="typing-bub">
      <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>
    </div>`;
  msgsEl.appendChild(d);
  scrollBot();
}

function addBot(data) {
  document.getElementById('tr')?.remove();

  const { reply, sentiment, confidence, source, faq_source,
          faq_score, escalate, ms } = data;

  const sc       = sentCls(sentiment);
  const label    = srcLabel(source, faq_source);
  const labelCls = srcCls(faq_source || source);

  // Score pill — show semantic score if available
  const scorePill = faq_score
    ? `<span class="pill pill-sem">sim ${faq_score.toFixed(2)}</span>`
    : '';

  // Escalation bar
  const escHtml = escalate
    ? `<div class="esc-bar">⚠️ This has been flagged — our senior team will contact you within 1 hour.</div>`
    : '';

  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `
    <div class="msg-av bot">Ch</div>
    <div class="col">
      <div class="bub bot">${esc(reply)}</div>
      <div class="meta">
        <span class="pill pill-${sc}">${sentEmoji(sentiment)} ${sentiment}</span>
        <span class="pill ${labelCls}">${label}</span>
        ${scorePill}
        <span class="pill-ms">${ms}ms</span>
      </div>
      ${escHtml}
    </div>`;
  msgsEl.appendChild(d);
  scrollBot();
}

function addErr(msg) {
  document.getElementById('tr')?.remove();
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `
    <div class="msg-av bot" style="background:#fde8e8;color:#c0392b;">!</div>
    <div class="col">
      <div class="bub bot" style="color:var(--text3);font-size:13px;">${esc(msg)}</div>
    </div>`;
  msgsEl.appendChild(d);
  scrollBot();
}

// ════════════════════════════════════════════════════
//  MAIN SEND FLOW
// ════════════════════════════════════════════════════

async function send() {
  const text = ciEl.value.trim();
  if (!text || busy) return;
  ciEl.value = '';
  ciEl.style.height = 'auto';
  busy = true;

  addUser(text);
  addTyping();

  try {
    const data = await callBackend(text);
    addBot(data);
  } catch (e) {
    console.error('[Chottu]', e);
    addErr(
      e.message.includes('Failed to fetch')
        ? 'Cannot reach server. Is chat.py running? (uvicorn main:app)'
        : `Error: ${e.message}`
    );
  } finally {
    busy = false;
  }
}

// Quick-send from chip buttons
function qs(text) { ciEl.value = text; send(); }

// Keyboard shortcuts
ciEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// Auto-grow textarea
ciEl.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 90) + 'px';
});

// Focus on load
window.addEventListener('load', () => ciEl.focus());
</script>
</body>
</html>
